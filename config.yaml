keywords:
  ai:
    - Claude
    - GPT
    - Gemini
    - Llama
    - LLM
    - AIエージェント
    - RAG
    - MCP
    - Anthropic
    - OpenAI
    - "Google DeepMind"
    - 推論モデル
    - ファインチューニング
  pc:
    - Ryzen
    - "Core Ultra"
    - Intel
    - AMD
    - RTX
    - Radeon
    - GeForce
    - DDR5
    - NVMe
    - PCIe
    - 自作
    - ベンチマーク
    - 価格改定
    - 発売
    - レビュー

database:
  path: "articles.db"
  retention_days: 30

llm:
  provider: "gemini"
  model: "gemini-2.0-flash"
  max_articles_per_category: 10
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:3b"

notification:
  output_dir: "output"
  slack_enabled: true
  discord_enabled: true

fetch:
  timeout_seconds: 30
  user_agent: "NewsBot/1.0"
